name: Build SAYVIS APK

on:
  push:
    branches:
      - main
      - 'arena/**'
  workflow_dispatch:

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Assemble Debug APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract app version
        id: ver
        run: echo "version=$(grep -oP 'versionName = \"\K[^\"]+' app/build.gradle.kts)" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install required Android SDK components
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager --install "platform-tools" "platforms;android-36" "build-tools;36.0.0" > /dev/null
          sdkmanager --install "platforms;android-36.1" > /dev/null 2>&1 \
            || echo "::warning::platforms;android-36.1 not found as sdkmanager package - relying on AGP auto-install"

      - name: Ensure debug signing keystore exists (stable across builds)
        run: |
          if [ ! -f debug.keystore ]; then
            echo "No committed keystore found - generating a new one (will be committed for stable signatures)."
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android -keypass android \
              -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          else
            echo "Reusing committed debug.keystore for a stable signature."
          fi

      - name: Build debug APK
        run: |
          set +e
          ./gradlew assembleDebug --stacktrace > build-full.log 2>&1
          build_status=$?
          echo "gradle exit code: $build_status"
          if [ $build_status -ne 0 ]; then
            echo "BUILD FAILED - emitting diagnostics as annotations"
            {
              echo "=== GRADLE BUILD FAILED (exit $build_status) ==="
              grep -E "^e: |error: |Caused by:|What went wrong" -A 4 build-full.log | head -140
              echo "=== TAIL OF FULL LOG ==="
              tail -n 400 build-full.log
            } > build-error.log 2>&1
            # Compile errors as annotations (readable via the REST API)
            grep -E "^e: |error: " build-full.log | head -25 | while IFS= read -r line; do
              echo "::error title=CompileError::${line:0:230}"
            done
            # Git diagnostics as annotations
            echo "::error title=DiagBranch::$(git branch --show-current)"
            echo "::error title=DiagHead::$(git log -1 --format=%h)"
            echo "::error title=DiagStatus::$(git status --porcelain | tr '\n' '|' | head -c 180)"
            git config user.name "sayvis-builder[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -f build-error.log
            git commit -m "chore(bot): attach build error log [skip ci]"
            git push > /tmp/pushout.txt 2>&1
            echo "::error title=DiagPush::$(head -c 180 /tmp/pushout.txt | tr '\n' '|')"
            exit 1
          fi
          exit 0

      - name: Run JVM unit tests (non-blocking for artifact delivery)
        run: |
          set +e
          ./gradlew testDebugUnitTest --stacktrace > test-full.log 2>&1
          test_status=$?
          echo "test exit code: $test_status"
          if [ $test_status -ne 0 ]; then
            echo "TESTS FAILED - committing test log for diagnosis"
            {
              echo "=== UNIT TESTS FAILED (exit $test_status) ==="
              grep -E "^e: |FAILED|error:" -B2 -A10 test-full.log | head -150
              tail -n 200 test-full.log
            } > test-error.log 2>&1
            git config user.name "sayvis-builder[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -f test-error.log
            git commit -m "chore(bot): attach test error log [skip ci]"
            git push
            if [ $? -ne 0 ]; then
              git pull --rebase origin HEAD
              git push
            fi
            exit 1
          fi
          exit 0
        continue-on-error: true

      - name: Show build outputs
        run: ls -la app/build/outputs/apk/debug/

      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: sayvis-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: Publish APK to branch (git transport)
        if: success()
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          git config user.name "sayvis-builder[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp "app/build/outputs/apk/debug/app-debug.apk" "SAYVIS-v${VERSION}-debug.apk"
          rm -f build-error.log test-error.log
          git rm -q --cached build-error.log test-error.log 2>/dev/null || true
          git add "SAYVIS-v${VERSION}-debug.apk" debug.keystore
          git commit -m "chore(bot): attach debug APK v${VERSION} [skip ci]" || echo "nothing to commit"
          git push || (git pull --rebase origin HEAD && git push)

      - name: Create GitHub Release with APK (public download page)
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          APK="SAYVIS-v${VERSION}-debug.apk"
          cp "app/build/outputs/apk/debug/app-debug.apk" "$APK"
          cat > release_notes.md <<EOF
          📦 SAYVIS v${VERSION} — سیستم‌عامل هوش مصنوعی شخصی (اندروید)

          🇮🇷 نصب:
          ۱. فایل APK را از بخش Assets همین صفحه دانلود کنید
          ۲. فایل را باز کنید و اجازهٔ نصب از «منابع ناشناس» را بدهید
          ۳. اگر نسخهٔ 1.0 نصب دارید، اول آن را حذف کنید (کلید امضا تغییر کرده)

          🇬🇧 Install:
          1. Download the APK from the Assets section below
          2. Open it and allow installing unknown apps
          3. If v1.0 is installed, uninstall it first (signing key changed)
          EOF
          if gh release view "v${VERSION}" > /dev/null 2>&1; then
            gh release upload "v${VERSION}" "$APK" --clobber
          else
            gh release create "v${VERSION}" \
              --title "SAYVIS v${VERSION}" \
              --notes-file release_notes.md \
              --target "$GITHUB_SHA" \
              "$APK"
          fi
