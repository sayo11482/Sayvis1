name: Build ODIN APK

# ODIN AGENT - Completely independent from SAYVIS
# Professional Quantitative Trading AI Agent

on:
  push:
    branches:
      - arena/*
      - main
    paths:
      - 'odin-agent/**'
      - '.github/workflows/build-odin-apk.yml'
  workflow_dispatch:

jobs:
  odin-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      pull-requests: write
      issues: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Provide debug keystore and google-services
        run: |
          set -e
          if [ -f debug.keystore ]; then
            mkdir -p odin-agent/app
            cp debug.keystore odin-agent/app/debug.keystore
            cp debug.keystore odin-agent/debug.keystore
            echo "Copied root debug.keystore"
          fi
          if [ ! -f odin-agent/app/debug.keystore ] && [ ! -f odin-agent/debug.keystore ]; then
            echo "Creating new debug keystore"
            mkdir -p odin-agent/app
            keytool -genkeypair -v \
              -keystore odin-agent/app/debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug, O=Android, C=US"
            cp odin-agent/app/debug.keystore odin-agent/debug.keystore || true
          fi
          # Ensure google-services.json exists for build
          if [ ! -f odin-agent/app/google-services.json ]; then
            echo "Creating dummy google-services.json for ODIN"
            cat > odin-agent/app/google-services.json <<'JSON'
          {
            "project_info": {
              "project_number": "123456789000",
              "project_id": "odin-agent-dummy",
              "storage_bucket": "odin-agent-dummy.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:123456789000:android:abcdef1234567890",
                  "android_client_info": {
                    "package_name": "com.odin.agent"
                  }
                },
                "oauth_client": [
                  {
                    "client_id": "123456789000-dummy.apps.googleusercontent.com",
                    "client_type": 3
                  }
                ],
                "api_key": [
                  {
                    "current_key": "AIzaSyDummyKeyForOdinAgentBuild1234567890"
                  }
                ],
                "services": {
                  "appinvite_service": {
                    "other_platform_oauth_client": [
                      {
                        "client_id": "123456789000-dummy.apps.googleusercontent.com",
                        "client_type": 3
                      }
                    ]
                  }
                }
              }
            ],
            "configuration_version": "1"
          }
          JSON
          fi
          ls -lh odin-agent/app/debug.keystore odin-agent/debug.keystore odin-agent/app/google-services.json 2>&1 || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Assemble ODIN debug APK
        id: build
        working-directory: odin-agent
        run: |
          set -o pipefail
          gradle :app:assembleDebug --no-daemon --stacktrace --console=plain 2>&1 | tee ../build-odin.log

      - name: Report build errors
        if: failure() && steps.build.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd odin-agent || cd .
          LOG="../build-odin.log"
          if [ ! -f "$LOG" ]; then LOG="build-odin.log"; fi
          if [ ! -f "$LOG" ]; then LOG="../build-odin.log"; fi
          grep -E "^e: |error:|What went wrong|Caused by|Could not|FAILED|Unresolved|> Task .* FAILED" "$LOG" 2>/dev/null | head -300 > errors-odin.txt || true
          [ -s errors-odin.txt ] || tail -n 200 "$LOG" 2>/dev/null > errors-odin.txt || echo "No log found" > errors-odin.txt
          head -n 10 errors-odin.txt | while IFS= read -r line; do echo "::error::${line}"; done
          {
            echo "### ODIN Build failed for ${GITHUB_SHA::7}"
            echo
            echo '```'
            head -c 60000 errors-odin.txt
            echo '```'
          } > comment-odin.md
          PR=$(gh pr list --head "${GITHUB_REF_NAME}" --json number --jq '.[0].number' || true)
          if [ -n "$PR" ]; then gh pr comment "$PR" --body-file comment-odin.md || true; fi

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: odin-build-log
          path: build-odin.log
          if-no-files-found: ignore

      - name: Upload ODIN APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: odin-agent-debug-apk
          path: odin-agent/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish ODIN APK to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          VERSION=$(grep -oP 'versionName = "\K[^"]+' odin-agent/app/build.gradle.kts)
          TAG="odin-v${VERSION}-build.${GITHUB_RUN_NUMBER}"
          OUT="ODIN-AGENT-${VERSION}-debug.apk"
          cp odin-agent/app/build/outputs/apk/debug/app-debug.apk "$OUT"
          sha256sum "$OUT" > "$OUT.sha256"
          cat > release-notes.md <<EOF
          ODIN.TRADE PRO v${VERSION} (build ${GITHUB_RUN_NUMBER}) - SEVINEX TECHNOLOGIES
          زیرمجموعه تجاری و انحصاری شرکت سوینکس (غیر اوپن‌سورس)

          ویژگی‌های نسخه نهایی پرو:
          - اصلاح کامل فونت‌ها و تایپوگرافی خوانا با دسته‌بندی شکیل
          - چارت به روز زنده با نمایش خطوط دقیق ورود، حد سود TP، حد ضرر SL، سر‌به‌سر و تریلینگ استاپ
          - نمایش جزئیات کامل استراتژی تست روی چارت
          - ۱۸ ماژول پیشرفته کوانت لایو
          - سیستم واریز دلاری USDT و برداشت توکن/دلار با ۵٪ کارمزد خروج برای سوینکس
          - بازی معاملاتی و مسابقات تورنمنتی با ۲۰٪ سهم سود سوینکس
          - ۴۵ آزمون سیستم ۱۰۰٪ پاس شده و بدون باگ
          EOF
          gh release create "$TAG" "$OUT" "$OUT.sha256" \
            --target "$GITHUB_SHA" \
            --title "ODIN.TRADE PRO ${VERSION} (build ${GITHUB_RUN_NUMBER}) - Sevinex Exclusive" \
            --notes-file release-notes.md \
            --prerelease
