name: Build ODIN APK

# Builds ODIN AGENT - Completely independent from SAYVIS
# Professional Quantitative Trading AI Agent

on:
  push:
    branches:
      - arena/*
      - main
    paths:
      - 'odin-agent/**'
      - '.github/workflows/build-odin-apk.yml'
  workflow_dispatch:

jobs:
  odin-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      pull-requests: write
      issues: write
    defaults:
      run:
        working-directory: odin-agent

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Provide debug keystore
        run: |
          # Try root debug.keystore first
          if [ -f ../debug.keystore ]; then
            cp ../debug.keystore app/debug.keystore
            cp ../debug.keystore ./debug.keystore
            echo "Copied root debug.keystore"
          fi
          if [ ! -f app/debug.keystore ] && [ ! -f ./debug.keystore ]; then
            echo "Creating new debug keystore"
            keytool -genkeypair -v \
              -keystore app/debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug, O=Android, C=US"
            cp app/debug.keystore ./debug.keystore || true
          fi
          ls -lh app/debug.keystore ./debug.keystore ../debug.keystore 2>&1 || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Assemble ODIN debug APK
        id: build
        run: |
          set -o pipefail
          gradle :app:assembleDebug --no-daemon --stacktrace --console=plain 2>&1 | tee ../build-odin.log

      - name: Report build errors
        if: failure() && steps.build.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd ..
          grep -E "^e: |error:|What went wrong|Caused by|Could not|FAILED|Unresolved|> Task .* FAILED" build-odin.log | head -300 > errors-odin.txt || true
          [ -s errors-odin.txt ] || tail -n 200 build-odin.log > errors-odin.txt
          head -n 10 errors-odin.txt | while IFS= read -r line; do echo "::error::${line}"; done
          {
            echo "### ❌ ODIN Build failed for \`${GITHUB_SHA::7}\`"
            echo
            echo '```'
            head -c 60000 errors-odin.txt
            echo '```'
          } > comment-odin.md
          PR=$(gh pr list --head "${GITHUB_REF_NAME}" --json number --jq '.[0].number' || true)
          if [ -n "$PR" ]; then gh pr comment "$PR" --body-file comment-odin.md; fi

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: odin-build-log
          path: build-odin.log
          if-no-files-found: ignore

      - name: Upload ODIN APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: odin-agent-debug-apk
          path: odin-agent/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish ODIN APK to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd ..
          VERSION=$(grep -oP 'versionName = "\K[^"]+' odin-agent/app/build.gradle.kts)
          TAG="odin-v${VERSION}-build.${GITHUB_RUN_NUMBER}"
          OUT="ODIN-AGENT-${VERSION}-debug.apk"
          cp odin-agent/app/build/outputs/apk/debug/app-debug.apk "$OUT"
          sha256sum "$OUT" > "$OUT.sha256"
          gh release create "$TAG" "$OUT" "$OUT.sha256" \
            --target "$GITHUB_SHA" \
            --title "ODIN AGENT ${VERSION} (build ${GITHUB_RUN_NUMBER}) - Quantitative Trading AI Agent - اودین ایجنت" \
            --notes "🔥 **ODIN AGENT ${VERSION}** - Professional Quantitative Trading AI Agent

**اودین ایجنت - عامل ترید کوانت و هوش مصنوعی حرفه‌ای**
**کاملاً جدا از پروژه سایویز**

### 🧠 5 استراتژی حرفه‌ای:
1. Trend Following (Multi-TF) - EMA20/50 + ADX>25 + Volume
2. Mean Reversion - BB + RSI + Z-Score
3. Momentum Breakout - ATR-based
4. Pairs Trading - Stat Arb
5. Volatility Regime Detection

### 🛡️ مدیریت ریسک غیرقابل مذاکره:
- 1% ریسک هر معامله
- 3% DD روزانه → Kill-switch
- 15% DD کلی → توقف

### 📱 ویژگی‌های اپ:
- Dashboard با ریسک مانیتور
- 5 استراتژی ماژولار
- بک‌تست با Sharpe, Sortino, MaxDD
- پیپر ترید زنده
- اتصال به بک‌اند FastAPI (n8n + Ollama + Qdrant)

### 🚀 نصب:
1. دانلود APK
2. فعال‌سازی Install unknown apps
3. نصب و اجرا - باید ببینی ODIN AGENT

