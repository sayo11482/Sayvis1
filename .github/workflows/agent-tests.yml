name: SAYVIS Agent Tests

on:
  push:
    branches:
      - arena/*
      - main
    paths:
      - 'agent/**'
      - '.github/workflows/agent-tests.yml'
  pull_request:
    paths:
      - 'agent/**'
  workflow_dispatch:

jobs:
  test-agent:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: agent/backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: agent/backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-cov httpx faker

      - name: Run professional tests
        run: |
          pytest tests/ -v --cov=app --cov-report=term-missing --cov-report=xml

      - name: Test agent core (offline mode)
        run: |
          python -m pytest tests/test_agent.py -v
          python -m pytest tests/test_tools.py -v
          python -m pytest tests/test_security.py -v

      - name: Test FastAPI (mocked services)
        run: |
          python -m pytest tests/test_api.py -v

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: agent-coverage
          path: agent/backend/coverage.xml

  docker-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build agent image
        uses: docker/build-push-action@v5
        with:
          context: ./agent/backend
          file: ./agent/backend/Dockerfile
          push: false
          tags: sayvis-agent:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Test docker-compose config
        working-directory: agent
        run: |
          docker compose config
          echo "✅ docker-compose.yml is valid"

  security-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner (fs)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: './agent'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'
