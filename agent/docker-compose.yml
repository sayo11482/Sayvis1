version: "3.8"

services:
  # =========================================================================
  # PostgreSQL - Main Database for Agent
  # =========================================================================
  postgres:
    image: postgres:16-alpine
    container_name: sayvis-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sayvis}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sayvis_secure_password_2024}
      POSTGRES_DB: ${POSTGRES_DB:-sayvis_agent}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sayvis} -d ${POSTGRES_DB:-sayvis_agent}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sayvis-network

  # =========================================================================
  # Qdrant - Vector Database for RAG & Long-term Memory
  # =========================================================================
  qdrant:
    image: qdrant/qdrant:v1.11.0
    container_name: sayvis-qdrant
    restart: unless-stopped
    environment:
      QDRANT__SERVICE__HTTP_PORT: 6333
      QDRANT__SERVICE__GRPC_PORT: 6334
    volumes:
      - qdrant_data:/qdrant/storage
      - ./qdrant_config:/qdrant/config
    ports:
      - "6333:6333"
      - "6334:6334"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/health"]
      interval: 15s
      timeout: 10s
      retries: 5
    networks:
      - sayvis-network

  # =========================================================================
  # Ollama - Local LLM Server
  # =========================================================================
  ollama:
    image: ollama/ollama:0.4.7
    container_name: sayvis-ollama
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "11434:11434"
    environment:
      OLLAMA_HOST: 0.0.0.0
      OLLAMA_ORIGINS: "*"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - sayvis-network
    profiles:
      - cpu
      - gpu
      - gpu-nvidia

  ollama-gpu:
    image: ollama/ollama:0.4.7
    container_name: sayvis-ollama-gpu
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "11434:11434"
    environment:
      OLLAMA_HOST: 0.0.0.0
      OLLAMA_ORIGINS: "*"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - sayvis-network
    profiles:
      - gpu
      - gpu-nvidia

  # =========================================================================
  # n8n - Workflow Automation
  # =========================================================================
  n8n:
    image: n8nio/n8n:1.60.1
    container_name: sayvis-n8n
    restart: unless-stopped
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: ${POSTGRES_DB:-sayvis_agent}
      DB_POSTGRESDB_USER: ${POSTGRES_USER:-sayvis}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD:-sayvis_secure_password_2024}
      DB_POSTGRESDB_SCHEMA: n8n
      N8N_BASIC_AUTH_ACTIVE: ${N8N_BASIC_AUTH_ACTIVE:-false}
      N8N_BASIC_AUTH_USER: ${N8N_BASIC_AUTH_USER:-admin}
      N8N_BASIC_AUTH_PASSWORD: ${N8N_BASIC_AUTH_PASSWORD:-admin123}
      N8N_HOST: ${N8N_HOST:-localhost}
      N8N_PORT: 5678
      N8N_PROTOCOL: ${N8N_PROTOCOL:-http}
      N8N_EDITOR_BASE_URL: ${N8N_EDITOR_BASE_URL:-http://localhost:5678}
      WEBHOOK_URL: ${WEBHOOK_URL:-http://localhost:5678/}
      GENERIC_TIMEZONE: ${GENERIC_TIMEZONE:-Asia/Tehran}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:-please_change_this_to_random_32_chars}
      N8N_METRICS: "true"
    volumes:
      - n8n_data:/home/node/.n8n
      - ./n8n/workflows:/home/node/workflows
      - ./n8n/custom-nodes:/home/node/.n8n/custom
    ports:
      - "5678:5678"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5678/healthz || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 5
    networks:
      - sayvis-network

  # =========================================================================
  # Redis - Short-term Memory & Cache (Optional)
  # =========================================================================
  redis:
    image: redis:7-alpine
    container_name: sayvis-redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-}
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - sayvis-network

  # =========================================================================
  # SAYVIS Professional AI Agent Backend
  # =========================================================================
  agent:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sayvis-agent
    restart: unless-stopped
    environment:
      # Core
      SAYVIS_ENV: ${SAYVIS_ENV:-development}
      SAYVIS_LOG_LEVEL: ${SAYVIS_LOG_LEVEL:-INFO}
      SAYVIS_SECRET_KEY: ${SAYVIS_SECRET_KEY:-change_me_to_random_64_chars_secret_key_for_jwt}
      SAYVIS_API_KEY: ${SAYVIS_API_KEY:-sayvis_dev_api_key_12345}
      
      # DB
      POSTGRES_USER: ${POSTGRES_USER:-sayvis}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sayvis_secure_password_2024}
      POSTGRES_DB: ${POSTGRES_DB:-sayvis_agent}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      DATABASE_URL: postgresql://$${POSTGRES_USER}:$${POSTGRES_PASSWORD}@postgres:5432/$${POSTGRES_DB:-sayvis_agent}
      
      # Qdrant
      QDRANT_HOST: qdrant
      QDRANT_PORT: 6333
      QDRANT_URL: http://qdrant:6333
      QDRANT_API_KEY: ${QDRANT_API_KEY:-}
      
      # Ollama
      OLLAMA_HOST: ollama
      OLLAMA_PORT: 11434
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:7b}
      OLLAMA_EMBED_MODEL: ${OLLAMA_EMBED_MODEL:-nomic-embed-text}
      
      # n8n
      N8N_API_URL: http://n8n:5678
      N8N_HOST: n8n
      N8N_PORT: 5678
      N8N_API_KEY: ${N8N_API_KEY:-}
      
      # Redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_URL: redis://redis:6379/0
      
      # Security
      ZERO_TRUST_ENABLED: ${ZERO_TRUST_ENABLED:-true}
      EMERGENCY_LOCK: ${EMERGENCY_LOCK:-false}
      
      # Features
      ENABLE_TRADING: ${ENABLE_TRADING:-false}
      ENABLE_WEB_SEARCH: ${ENABLE_WEB_SEARCH:-true}
      ENABLE_RAG: ${ENABLE_RAG:-true}
      ENABLE_N8N_TOOLS: ${ENABLE_N8N_TOOLS:-true}
      
      # External APIs
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
    volumes:
      - ./backend/app:/app/app
      - agent_data:/app/data
      - ./backend/tests:/app/tests
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      ollama:
        condition: service_healthy
      redis:
        condition: service_healthy
      n8n:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 10s
      retries: 8
      start_period: 60s
    networks:
      - sayvis-network

  # =========================================================================
  # Ollama Model Puller (init container)
  # =========================================================================
  ollama-pull:
    image: ollama/ollama:0.4.7
    container_name: sayvis-ollama-pull
    volumes:
      - ollama_data:/root/.ollama
    entrypoint: /bin/sh
    command: >
      -c "
      echo 'Waiting for Ollama...' &&
      until curl -s http://ollama:11434/api/tags > /dev/null; do sleep 2; done &&
      echo 'Pulling models...' &&
      ollama pull qwen2.5:7b || true &&
      ollama pull nomic-embed-text || true &&
      echo 'Models ready'
      "
    depends_on:
      ollama:
        condition: service_healthy
    networks:
      - sayvis-network
    profiles:
      - cpu
      - setup

volumes:
  postgres_data:
    name: sayvis_postgres_data
  qdrant_data:
    name: sayvis_qdrant_data
  ollama_data:
    name: sayvis_ollama_data
  n8n_data:
    name: sayvis_n8n_data
  redis_data:
    name: sayvis_redis_data
  agent_data:
    name: sayvis_agent_data

networks:
  sayvis-network:
    name: sayvis_network
    driver: bridge
